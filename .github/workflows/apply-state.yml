name: apply state note once

on:
  push:
    branches:
      - docs/state-after-normalize
    paths:
      - .github/workflows/apply-state.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/state-after-normalize
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply the state patch and drop the helper
        run: |
          set -euo pipefail
          tr -d '\n' < .github/state.b64 | base64 -d > /tmp/state.patch
          echo "968c23e35d3898bab1f67bbf72d7dbf2fd3fd439c360484d4bd74b7a0ce0258f  /tmp/state.patch" | sha256sum -c -
          git apply /tmp/state.patch
          git add docs/project-state.md
          git rm -f .github/state.b64 .github/workflows/apply-state.yml
          git -c user.name='niccolopello-source' -c user.email='niccolo.pello@gmail.com' commit -m "docs: record that the role normalization is on main" -m "Pull request #2 is merged. project-state.md no longer says the normalization is still on a branch. P0-REPEAT stays open in TASKS.md until pull request #3 is on main."
          git push origin HEAD:docs/state-after-normalize
