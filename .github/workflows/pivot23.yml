name: PIVOT 23 beta

on:
  push:
    paths:
      - "apps/pivot23/**"
      - ".github/workflows/pivot23.yml"
      - "package.json"
  pull_request:
    paths:
      - "apps/pivot23/**"
      - ".github/workflows/pivot23.yml"
      - "package.json"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/pivot23
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/pivot23/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build
      - run: pnpm run test:e2e
