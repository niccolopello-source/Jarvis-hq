<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>PIVOT 23 — La tua carriera cestistica</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <style>
      :root {
        --color-granata: #6C1320;
        --color-granata-ink: #A31D2E;
      }
      html, body { background: #0c0b0d; margin: 0; }
      #boot {
        background:
          radial-gradient(ellipse 68% 46% at 50% 42%, color-mix(in srgb, var(--color-granata-ink) 32%, transparent), transparent 72%),
          #0c0b0d;
        color: #f5f5f7;
      }
      #boot .boot-muted { color: #b7a8ab; }
      .boot-mark { width: min(72vw, 420px); display: grid; place-items: center; }
      .boot-logo { width: 100%; height: auto; display: block; overflow: visible; }
      .boot-ring { fill: #f5f5f7; }
      .boot-gleam path {
        stroke-dasharray: 12 78;
        stroke-dashoffset: 16;
        opacity: 0;
        animation: bootArc 2.2s cubic-bezier(0.16, 1, 0.3, 1) 1 both;
      }
      .boot-word {
        margin: 22px 0 0;
        font-size: 15px;
        font-weight: 650;
        letter-spacing: 0.42em;
        color: #f5f5f7;
      }
      @keyframes bootArc {
        0% { opacity: 0; stroke-dashoffset: 16; }
        16% { opacity: 0.95; }
        100% { opacity: 0; stroke-dashoffset: -68; }
      }
      /* Loading copy only appears when the load is genuinely slow, so a normal start is just the mark. */
      .boot-late { opacity: 0; animation: bootLate 0.4s ease-out 1.6s forwards; }
      @keyframes bootLate { to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .boot-gleam path { animation: none; opacity: 0; }
        .boot-late { animation-duration: 0.01s; }
      }
      /* Hand-off: src/intro.ts lifts #boot above the mounted app and plays it out (transform/opacity only). */
      #boot.is-curtain {
        --band: clamp(140px, 24vw, 340px);
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        min-height: 0 !important;
        pointer-events: none;
        animation: curtainSafety 0.3s linear 8s forwards;
      }
      /* The gleam animates stroke-dashoffset, which repaints on the main thread: stop it once the app is mounting. */
      #boot.is-curtain .boot-gleam path { animation: none; opacity: 0; }
      /* The stinger edge: a skewed granata band with a chalk line, trailing the dark field as it leaves. */
      #boot.is-curtain.leave-full::before {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        left: calc(-1 * (var(--band) + 20vh));
        width: calc(var(--band) + 50vh);
        z-index: -1;
        transform: skewX(-10deg);
        background:
          linear-gradient(90deg, transparent 0, rgba(108, 19, 32, 0.55) 30%, #6C1320 62%, #A31D2E calc(100% - 6px), #f6ecee calc(100% - 6px), #f6ecee calc(100% - 2px), #0c0b0d calc(100% - 2px)) left / var(--band) 100% no-repeat,
          linear-gradient(90deg, #0c0b0d 64%, transparent) right / calc(100% - var(--band)) 100% no-repeat;
      }
      #boot.is-curtain.leave-full {
        will-change: transform;
        animation: curtainWipe 0.52s cubic-bezier(0.76, 0, 0.24, 1) both;
      }
      #boot.is-curtain.leave-full .boot-mark {
        animation: curtainFade 0.26s cubic-bezier(0.4, 0, 1, 1) both;
      }
      #boot.is-curtain.leave-full.leave-now {
        animation: curtainWipe 0.52s cubic-bezier(0.76, 0, 0.24, 1) both, curtainFade 0.14s linear both;
      }
      #boot.is-curtain.leave-brief { animation: curtainFade 0.22s ease-out both; }
      #boot.is-curtain.leave-still { animation: curtainFade 0.16s linear both; }
      @keyframes curtainWipe {
        from { transform: translate3d(0, 0, 0); }
        to { transform: translate3d(calc(100vw + var(--band) + 45vh), 0, 0); }
      }
      @keyframes curtainFade { to { opacity: 0; } }
      @keyframes curtainSafety { to { opacity: 0; visibility: hidden; } }
    </style>
  </head>
  <body>
    <div id="app">
      <main
        id="boot"
        role="status"
        aria-live="polite"
        style="min-height:100vh;display:grid;place-content:center;justify-items:center;gap:12px;padding:24px;box-sizing:border-box;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;text-align:center"
      >
        <div class="boot-mark" aria-hidden="true">
          <svg class="boot-logo" viewBox="0 0 80 80" role="img">
            <circle cx="40" cy="40" r="34.6" fill="none" stroke="var(--color-granata-ink)" stroke-width="5.4" />
            <g fill="none" stroke="var(--color-granata-ink)" stroke-width="3.15" stroke-linecap="round">
              <path d="M22.2 22.4 A22.2 22.2 0 0 1 57.8 22.4" />
              <path d="M57.8 57.6 A22.2 22.2 0 0 1 22.2 57.6" />
            </g>
            <g class="boot-gleam" fill="none" stroke="#f6ecee" stroke-width="3.15" stroke-linecap="round">
              <path d="M22.2 22.4 A22.2 22.2 0 0 1 57.8 22.4" />
              <path d="M57.8 57.6 A22.2 22.2 0 0 1 22.2 57.6" />
            </g>
            <line x1="4.2" y1="40" x2="16.6" y2="40" stroke="var(--color-granata-ink)" stroke-width="4.4" stroke-linecap="square" />
            <line x1="63.4" y1="40" x2="75.8" y2="40" stroke="var(--color-granata-ink)" stroke-width="4.4" stroke-linecap="square" />
            <text class="boot-ring" x="40" y="41.5" text-anchor="middle" dominant-baseline="central" font-size="26" font-weight="700" letter-spacing="-0.07em" font-family="Figtree, -apple-system, BlinkMacSystemFont, system-ui, sans-serif">23</text>
          </svg>
        </div>
        <strong class="boot-word">PIVOT</strong>
        <p class="boot-late" style="margin:8px 0 0;font-size:14px">Avvio dell’applicazione… <span lang="en" class="boot-muted">· Loading…</span></p>
        <p class="boot-muted boot-late" style="margin:0;font-size:14px">Se la schermata non cambia, ricarica la pagina. <span lang="en">If nothing changes, reload the page.</span></p>
        <a class="boot-late" href="./" style="width:max-content;color:#f5f5f7;font-size:14px;font-weight:600">Ricarica PIVOT 23 · <span lang="en">Reload</span></a>
        <noscript>Attiva JavaScript per giocare a PIVOT 23. <span lang="en">Enable JavaScript to play PIVOT 23.</span></noscript>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
